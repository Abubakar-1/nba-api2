<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maintenance Mode</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Helvetica, Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        background: #ffffff;
        color: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .container {
        max-width: 520px;
        text-align: center;
      }

      .badge {
        display: inline-block;
        padding: 6px 14px;
        border-radius: 999px;
        background: #f1f5f9;
        color: #334155;
        font-size: 12px;
        letter-spacing: 0.5px;
        margin-bottom: 20px;
      }

      h1 {
        font-size: 32px;
        line-height: 1.2;
        margin-bottom: 16px;
      }

      p {
        font-size: 16px;
        line-height: 1.6;
        color: #475569;
        margin-bottom: 24px;
      }

      .timer {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 24px;
        color: #020617;
      }

      .footer {
        font-size: 13px;
        color: #64748b;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="badge">Maintenance Mode</div>

      <h1>We’ll be back shortly</h1>

      <p>
        Our website is currently undergoing scheduled maintenance to improve
        performance and reliability.
      </p>

      <div class="timer" id="countdown">
        Returning in 02:00:00
      </div>

      <div class="footer">
        Thank you for your patience.
      </div>
    </div>

    <script>
      // Set maintenance duration (2 hours from page load)
      const maintenanceDuration = 2 * 60 * 60 * 1000;
      const endTime = new Date().getTime() + maintenanceDuration;

      const countdownEl = document.getElementById("countdown");

      function updateCountdown() {
        const now = new Date().getTime();
        const distance = endTime - now;

        if (distance <= 0) {
          countdownEl.innerHTML = "We are back online.";
          return;
        }

        const hours = Math.floor(
          (distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)
        );
        const minutes = Math.floor(
          (distance % (1000 * 60 * 60)) / (1000 * 60)
        );
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        countdownEl.innerHTML =
          "Returning in " +
          String(hours).padStart(2, "0") +
          ":" +
          String(minutes).padStart(2, "0") +
          ":" +
          String(seconds).padStart(2, "0");
      }

      updateCountdown();
      setInterval(updateCountdown, 1000);
    </script>
  </body>
</html>
